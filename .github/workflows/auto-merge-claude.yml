name: Auto-merge Claude branches
on:
  push:
    branches: ['claude/**', 'claude/*']
permissions:
  contents: write
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
      - run: |
          BRANCH="${{ github.ref_name }}"
          git fetch origin $BRANCH
          git merge origin/$BRANCH --no-edit -m "Auto-merge $BRANCH into main"
          git push origin main
      - if: success()
        run: git push origin --delete ${{ github.ref_name }} || true
      - name: Deploy to cPanel
        if: success()
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "${{ secrets.CPANEL_URL }}/execute/VersionControl/update?repository_root=%2Fhome%2F${{ secrets.CPANEL_USERNAME }}%2Flinkngon.top%2Fwp-content%2Fthemes%2Flinkngon-theme&branch=main"
